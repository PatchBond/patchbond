[package]
name = "patchbond-judge"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "PatchBond's PR judge as an OutLayer program (Intel TDX): GitHub facts + NEAR AI verdict, no PatchBond server in the loop"

[dependencies]
base64 = "0.22"
fancy-regex = "0.14"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"

[target.'cfg(target_os = "wasi")'.dependencies]
wasi = "0.13"

[profile.release]
opt-level = "z"
lto = true
strip = true
