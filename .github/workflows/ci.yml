name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript — typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: shared, server (judge, bot, pre-flight), mcp
        run: |
          (cd shared && bun test)
          (cd server && bun test)
          (cd mcp && bun test)
      - run: cd web && bunx vite build

  contract:
    name: Contract — unit + near-workspaces sandbox tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - run: cargo clippy -p patchbond-vault --all-targets -- -D warnings
      - run: cargo near build non-reproducible-wasm --manifest-path vault/Cargo.toml
      - run: cargo near build non-reproducible-wasm --manifest-path mock-ft/Cargo.toml
      - run: cargo test -p patchbond-vault
