[package]
name = "patchbond-vault"
description = "PatchBond: refundable bonds on unsolicited open-source work, with an on-chain attention-pricing curve"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/patchbond/patchbond"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
near-workspaces = { version = "0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
